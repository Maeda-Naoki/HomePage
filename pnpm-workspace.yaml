# General config
saveExact: true

##### dependency-resolution #####
# minimumReleaseAge defines the minimum number of minutes that must pass after a version is published before pnpm will install it. This applies to all dependencies, including transitive ones.
# Ref: https://pnpm.io/ja/settings/dependency-resolution#minimumreleaseage
minimumReleaseAge: 10080
# パッケージ署名等の信頼レベルが下がった場合インストール拒否
# Ref: https://pnpm.io/ja/settings/dependency-resolution#trustpolicy
trustPolicy: no-downgrade
# When set to true, only direct dependencies (those listed in your root package.json) may use exotic sources (like git repositories or direct tarball URLs).
# Ref: https://pnpm.io/ja/settings/dependency-resolution#trustpolicy
blockExoticSubdeps: true
